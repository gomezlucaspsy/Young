name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile every Python file
        run: python -m py_compile *.py
      - name: Run the sample program
        run: python young_runner.py sample.young
      - name: Every committed .young file parses
        run: |
          python - <<'PY'
          import glob, sys
          from young_runner import tokenize, Parser
          bad = 0
          for path in sorted(glob.glob("**/*.young", recursive=True)):
              try:
                  Parser(tokenize(open(path, encoding="utf-8").read())).parse_program()
                  print(f"ok   {path}")
              except Exception as ex:
                  bad += 1
                  print(f"FAIL {path}: {ex}")
          sys.exit(1 if bad else 0)
          PY
